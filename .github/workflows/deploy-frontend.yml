name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'SISTEMA_WEB_NFE/client/**'
      - '.github/workflows/deploy-frontend.yml'
      - 'SISTEMA_WEB_NFE/server/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: SISTEMA_WEB_NFE/client/package-lock.json

      - name: Install dependencies
        working-directory: SISTEMA_WEB_NFE/client
        run: npm ci

      - name: Build
        working-directory: SISTEMA_WEB_NFE/client
        env:
          VITE_API_URL: https://nfe-backend-nwb0.onrender.com
          VITE_BASE_PATH: /PRODUTO-QUIMICO/
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'SISTEMA_WEB_NFE/client/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
